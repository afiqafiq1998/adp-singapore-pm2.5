
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>North Singapore Live 1-HR PM2.5</title>


<style>

/* ==========================================
   BASIC SETTINGS
   ========================================== */

:root {

    --bg-color: #f4f7f6;

    --card-bg: #ffffff;

    --text-main: #333333;

    --text-muted: #666666;

    --accent: #0076a3;

    --border-radius: 28px;

}


* {

    box-sizing: border-box;

}


html,
body {

    margin: 0;

    width: 100%;

    min-height: 100%;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background: var(--bg-color);

    color: var(--text-main);

}


/* ==========================================
   MAIN PAGE
   ========================================== */

body {

    display: flex;

    justify-content: center;

    align-items: flex-start;

    padding: 40px;

}


.container {

    width: 100%;

    max-width: 1200px;

    text-align: center;

}


/* ==========================================
   HEADER
   ========================================== */

header {

    margin-bottom: 25px;

}


h1 {

    margin: 0;

    font-size: clamp(
        40px,
        4vw,
        64px
    );

    font-weight: 700;

    color: var(--accent);

    letter-spacing: 1px;

}


.subtitle {

    margin-top: 8px;

    font-size: clamp(
        20px,
        2vw,
        30px
    );

    color: var(--text-muted);

}


/* ==========================================
   PM2.5 CARD
   ========================================== */

.psi-card {

    background: var(--card-bg);

    border-radius: var(--border-radius);

    padding: 45px 40px 40px;

    box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.08);

    border:
        1px solid
        rgba(0, 0, 0, 0.04);

}


.region-name {

    font-size: clamp(
        26px,
        2.5vw,
        40px
    );

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 4px;

    color: var(--text-muted);

    margin-bottom: 15px;

}


/* ==========================================
   PM2.5 NUMBER
   ========================================== */

.psi-value {

    font-size: clamp(
        150px,
        17vw,
        280px
    );

    font-weight: 800;

    line-height: 0.9;

    margin: 0 0 30px;

    transition:
        color 0.4s ease;

}


.loading {

    color: var(--text-muted);

}


/* ==========================================
   PM2.5 COLOURS
   ========================================== */

.psi-good {

    color: #28a745;

}


.psi-moderate {

    color: #e0a800;

}


.psi-unhealthy {

    color: #dc3545;

}


.psi-very-unhealthy {

    color: #8e44ad;

}


/* ==========================================
   STATUS BADGE
   ========================================== */

.status-badge {

    display: inline-block;

    padding: 12px 35px;

    border-radius: 50px;

    font-size: clamp(
        24px,
        2.5vw,
        38px
    );

    font-weight: 700;

}


.status-good {

    background: #d4edda;

    color: #155724;

}


.status-moderate {

    background: #fff3cd;

    color: #856404;

}


.status-unhealthy {

    background: #f8d7da;

    color: #721c24;

}


.status-very-unhealthy {

    background: #e8d7f5;

    color: #5a189a;

}


/* ==========================================
   PM2.5 BAND RANGE
   ========================================== */

.pm25-range {

    margin-top: 15px;

    font-size: clamp(
        18px,
        1.8vw,
        28px
    );

    font-weight: 600;

    color: var(--text-muted);

}


/* ==========================================
   INFORMATION ROW
   ========================================== */

.info {

    margin-top: 25px;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 45px;

    flex-wrap: wrap;

    font-size: clamp(
        18px,
        1.5vw,
        26px
    );

    color: var(--text-muted);

}


.info-item {

    white-space: nowrap;

}


.info-label {

    font-weight: 700;

    color: var(--text-main);

}


/* ==========================================
   COUNTDOWN
   ========================================== */

#countdown {

    font-weight: 700;

    color: var(--accent);

}


/* ==========================================
   ERROR MESSAGE
   ========================================== */

.error-message {

    display: none;

    margin-top: 20px;

    padding: 12px 20px;

    border-radius: 10px;

    background: #f8d7da;

    color: #721c24;

    font-size: 18px;

}


/* ==========================================
   SMALL SCREEN
   ========================================== */

@media (max-width: 700px) {

    body {

        padding: 20px;

    }


    .psi-card {

        padding: 35px 20px;

    }


    .info {

        gap: 12px;

    }

}


/* ==========================================
   SHORT TV / LAPTOP SCREEN
   ========================================== */

@media (max-height: 800px) {

    body {

        padding: 20px 40px;

    }


    header {

        margin-bottom: 15px;

    }


    .psi-card {

        padding: 25px 30px;

    }


    .region-name {

        margin-bottom: 8px;

    }


    .psi-value {

        font-size: clamp(
            120px,
            15vw,
            220px
        );

        margin-bottom: 20px;

    }


    .info {

        margin-top: 15px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- ======================================
     HEADER
     ====================================== -->

<header>

    <h1>
        NORTH SINGAPORE
    </h1>


    <div class="subtitle">

        1-Hour PM<sub>2.5</sub>
        (&mu;g/m&sup3;)

    </div>

</header>



<!-- ======================================
     PM2.5 CARD
     ====================================== -->

<div class="psi-card">


    <div class="region-name">

        NORTH

    </div>


    <div
        id="psi-north"
        class="psi-value loading"
    >

        --

    </div>


    <div
        id="band-north"
        class="status-badge status-moderate"
    >

        Loading...

    </div>


    <!-- BAND RANGE -->

    <div
        id="range-north"
        class="pm25-range"
    >

        Band --: -- µg/m³

    </div>


</div>



<!-- ======================================
     INFORMATION
     ====================================== -->

<div class="info">


    <div class="info-item">

        <span class="info-label">
            NEA updated:
        </span>

        <span id="update-timestamp">
            Loading...
        </span>

    </div>


    <div class="info-item">

        <span class="info-label">
            NEXT REFRESH IN:
        </span>

        <span id="countdown">
            30:00
        </span>

    </div>


    <div class="info-item">

        <span class="info-label">
            Singapore time:
        </span>

        <span id="clock">
            --:--:--
        </span>

    </div>


</div>



<!-- ======================================
     ERROR
     ====================================== -->

<div
    id="error-banner"
    class="error-message"
></div>


</div>



<script>


/* ==========================================
   API SETTINGS
   ========================================== */

const API_URL =
    "https://api-open.data.gov.sg/v2/real-time/api/pm25";


/*
 * Refresh every 30 minutes.
 */

const REFRESH_INTERVAL =
    30 * 60 * 1000;


/*
 * Time of next refresh.
 */

let nextRefreshTime =
    Date.now() + REFRESH_INTERVAL;



/* ==========================================
   STATUS + BAND
   ========================================== */

function getStatus(value) {


    /*
     * BAND 1
     * 0–55
     */

    if (value <= 55) {

        return {

            text:
                "NORMAL",

            numberClass:
                "psi-good",

            badgeClass:
                "status-good",

            band:
                "Band 1",

            range:
                "0–55 µg/m³"

        };

    }


    /*
     * BAND 2
     * 56–150
     */

    if (value <= 150) {

        return {

            text:
                "ELEVATED",

            numberClass:
                "psi-moderate",

            badgeClass:
                "status-moderate",

            band:
                "Band 2",

            range:
                "56–150 µg/m³"

        };

    }


    /*
     * BAND 3
     * 151–250
     */

    if (value <= 250) {

        return {

            text:
                "HIGH",

            numberClass:
                "psi-unhealthy",

            badgeClass:
                "status-unhealthy",

            band:
                "Band 3",

            range:
                "151–250 µg/m³"

        };

    }


    /*
     * BAND 4
     * Above 250
     */

    return {

        text:
            "VERY HIGH",

        numberClass:
            "psi-very-unhealthy",

        badgeClass:
            "status-very-unhealthy",

        band:
            "Band 4",

        range:
            ">250 µg/m³"

    };

}



/* ==========================================
   COUNTDOWN TIMER
   ========================================== */

function updateCountdown() {


    const countdown =
        document.getElementById(
            "countdown"
        );


    const remaining =
        Math.max(
            0,
            nextRefreshTime -
            Date.now()
        );


    const totalSeconds =
        Math.ceil(
            remaining / 1000
        );


    const minutes =
        Math.floor(
            totalSeconds / 60
        );


    const seconds =
        totalSeconds % 60;


    countdown.textContent =
        minutes +
        ":" +
        String(seconds).padStart(
            2,
            "0"
        );

}



/* ==========================================
   SINGAPORE CLOCK
   ========================================== */

function updateClock() {


    const clock =
        document.getElementById(
            "clock"
        );


    const now =
        new Date();


    clock.textContent =
        now.toLocaleTimeString(
            "en-SG",
            {

                timeZone:
                    "Asia/Singapore",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hour12:
                    false

            }
        );

}



/* ==========================================
   FETCH NORTH PM2.5
   ========================================== */

async function fetchNorthPM25() {


    const valueDisplay =
        document.getElementById(
            "psi-north"
        );


    const badgeDisplay =
        document.getElementById(
            "band-north"
        );


    const rangeDisplay =
        document.getElementById(
            "range-north"
        );


    const timestampDisplay =
        document.getElementById(
            "update-timestamp"
        );


    const errorBanner =
        document.getElementById(
            "error-banner"
        );


    try {


        console.log(
            "Fetching NEA PM2.5..."
        );


        /*
         * Timestamp prevents browser caching.
         */

        const response =
            await fetch(
                API_URL +
                "?t=" +
                Date.now(),
                {

                    method:
                        "GET",

                    cache:
                        "no-store"

                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const json =
            await response.json();


        console.log(
            "NEA response:",
            json
        );


        /*
         * Find the latest item
         * containing North data.
         */

        const item =
            json
                ?.data
                ?.items
                ?.find(
                    item =>
                        item
                            ?.readings
                            ?.pm25_one_hourly
                            ?.north
                            !== undefined
                );


        if (!item) {

            throw new Error(
                "North PM2.5 data not found."
            );

        }


        /*
         * Get North reading.
         */

        const northValue =
            Number(
                item
                    .readings
                    .pm25_one_hourly
                    .north
            );


        if (
            !Number.isFinite(
                northValue
            )
        ) {

            throw new Error(
                "North PM2.5 value is invalid."
            );

        }


        console.log(
            "North PM2.5:",
            northValue
        );


        /* ==================================
           DISPLAY NUMBER
           ================================== */

        valueDisplay.textContent =
            Math.round(
                northValue
            );


        valueDisplay.classList.remove(
            "loading",
            "psi-good",
            "psi-moderate",
            "psi-unhealthy",
            "psi-very-unhealthy"
        );


        /* ==================================
           GET STATUS / BAND
           ================================== */

        const status =
            getStatus(
                northValue
            );


        /* ==================================
           NUMBER COLOUR
           ================================== */

        valueDisplay.classList.add(
            status.numberClass
        );


        /* ==================================
           STATUS BADGE
           ================================== */

        badgeDisplay.textContent =
            status.text;


        badgeDisplay.className =
            "status-badge " +
            status.badgeClass;


        /* ==================================
           BAND RANGE
           ================================== */

        rangeDisplay.textContent =
            status.band +
            ": " +
            status.range;


        /* ==================================
           NEA UPDATE TIME
           ================================== */

        const updatedTimestamp =
            item.updatedTimestamp ||
            item.update_timestamp;


        if (updatedTimestamp) {


            const neaTime =
                new Date(
                    updatedTimestamp
                );


            timestampDisplay.textContent =
                neaTime.toLocaleTimeString(
                    "en-SG",
                    {

                        timeZone:
                            "Asia/Singapore",

                        hour:
                            "2-digit",

                        minute:
                            "2-digit",

                        hour12:
                            false

                    }
                );

        }

        else {

            timestampDisplay.textContent =
                "Unavailable";

        }


        /* ==================================
           SUCCESS
           ================================== */

        errorBanner.style.display =
            "none";


        /*
         * Restart 30-minute countdown
         * after successful update.
         */

        nextRefreshTime =
            Date.now() +
            REFRESH_INTERVAL;


        updateCountdown();


    }


    catch (error) {


        console.error(
            "NEA PM2.5 error:",
            error
        );


        /*
         * Keep the previous valid
         * PM2.5 reading if the API
         * temporarily fails.
         */

        errorBanner.textContent =
            "Unable to retrieve NEA PM2.5 data.";


        errorBanner.style.display =
            "block";

    }

}



/* ==========================================
   INITIAL START
   ========================================== */

updateClock();

updateCountdown();

fetchNorthPM25();



/* ==========================================
   CLOCK
   ========================================== */

setInterval(
    updateClock,
    1000
);



/* ==========================================
   COUNTDOWN
   ========================================== */

setInterval(
    updateCountdown,
    1000
);



/* ==========================================
   PM2.5 REFRESH
   ========================================== */

setInterval(
    fetchNorthPM25,
    REFRESH_INTERVAL
);


</script>


</body>

</html>
